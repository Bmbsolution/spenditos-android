# Local e2e harness (spenditos: pnpm --filter @spenditos/functions run serve:e2e).
# Debug-only flavor. Reach it from the emulator with: adb reverse tcp:4310 tcp:4310
# The token is the harness's synthetic Home seed user (E2E_HOME_USER_ID in
# spenditos/packages/functions/e2e/src/seed-home.ts), accepted only by the local stub
# authorizer. Never a real credential. Harness data lives in a throwaway DynamoDB Local,
# so writes from the app disappear when the harness restarts.
API_BASE_URL=http://127.0.0.1:4310
HARNESS_AUTH_TOKEN=e2e-22222222-2222-4222-8222-222222222222
DEPLOYMENT_STAGE=harness
APP_ENV_NAME=Harness
CLIENT_CONFIG_VERSION=local
SHOW_ENV_BADGE=true
